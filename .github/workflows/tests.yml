name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntaxe
        run: node --check js/core.js && node --check js/ui.js && node --check tools/bundle.js
      - name: Tests de référence et audit des angles
        run: npm test
      - name: Essais aléatoires
        run: npm run fuzz
        env:
          SEED: ${{ github.run_number }}
          N: 60
      - name: Version en un seul fichier
        run: npm run bundle
